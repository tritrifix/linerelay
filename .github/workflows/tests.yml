name: Tests

# Tests unitaires et HTTP (sources externes simulées : aucun appel réseau),
# vérification de syntaxe des scripts, validation des fichiers Compose.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 18 : version minimale déclarée dans package.json ; 20 : celle de l'image.
        node: [18, 20]
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Installer Node ${{ matrix.node }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier la syntaxe JavaScript
        run: npm run check

      - name: Lancer les tests
        run: npm test

      - name: Vérifier les scripts shell et Python
        run: |
          bash -n start.sh
          bash -n install.sh
          python3 -m py_compile fallback_gtfs.py tools/build_traces.py

      - name: Valider les fichiers Compose
        run: |
          docker compose -f compose.yaml config -q
          docker compose -f compose.prod.yaml config -q
