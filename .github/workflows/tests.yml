name: Tests

# Tests unitaires et HTTP (sources externes simulées : aucun appel réseau),
# vérification de syntaxe des scripts, validation des fichiers Compose.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 22 : version minimale déclarée dans package.json ; 24 et 26 : LTS actives (26 : image Docker).
        node: [22, 24, 26]
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Installer Node ${{ matrix.node }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier la syntaxe JavaScript
        run: npm run check

      - name: Lancer les tests
        run: npm test

      - name: Vérifier les scripts shell et Python
        run: |
          bash -n start.sh
          bash -n install.sh
          python3 -m py_compile fallback_gtfs.py tools/build_traces.py

      - name: Valider les fichiers Compose
        run: |
          docker compose -f compose.yaml config -q
          docker compose -f compose.prod.yaml config -q
