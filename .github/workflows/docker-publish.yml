name: Publier l'image Docker

# Construit l'image LineRelay et la publie sur GitHub Container Registry.
#   - push sur main        -> ghcr.io/<owner>/linerelay:main + :sha-<court>
#   - tag v*               -> :v1.2.3, :1.2, :1, :latest
#   - pull request         -> build de vérification, sans publication
#   - déclenchement manuel -> onglet Actions
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Préparer Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Se connecter à GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Calculer les tags et labels
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      # Le build télécharge le GTFS statique pour générer les tracés : le
      # runner a accès au réseau, mais la source peut être momentanément
      # indisponible. En cas d'échec, relancer le job.
      #
      # Trois temps : construire et charger l'image dans le Docker du runner,
      # la vérifier, puis seulement la publier. La vérification porte ainsi
      # sur chaque pull request, et rien de non vérifié n'atteint le registre.
      - name: Construire
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          push: false
          tags: linerelay:ci
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Mêmes contraintes que compose.prod.yaml : système de fichiers en
      # lecture seule, aucune capacité Linux, pas d'élévation de privilèges.
      - name: Vérifier que l'image démarre sous les contraintes de production
        run: |
          docker run -d --name linerelay-check \
            --read-only --tmpfs /tmp:size=16m \
            --cap-drop ALL --security-opt no-new-privileges \
            -p 3000:3000 linerelay:ci
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000/api/health >/dev/null; then
              echo "Sonde de santé OK"
              docker logs linerelay-check
              docker rm -f linerelay-check
              exit 0
            fi
            sleep 2
          done
          echo "L'image ne répond pas sur /api/health" >&2
          docker logs linerelay-check >&2
          docker rm -f linerelay-check
          exit 1

      # Reprend le cache du build ci-dessus : aucune recompilation.
      - name: Publier
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
