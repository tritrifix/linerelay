<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5" />
    <title>LineRelay — Carte des transports en temps réel · Dijon</title>

    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="map"></div>

    <header id="topbar">
      <span class="badge" id="line-badge">—</span>
      <select id="line-select" aria-label="Choisir une ligne">
        <option>Chargement…</option>
      </select>
      <span id="line-service" class="service"></span>
      <button id="delays-toggle" class="toggle" type="button" aria-pressed="false" title="Afficher les retards">⏱ Retards</button>
    </header>

    <div id="status" class="status">
      <span class="dot" id="status-dot"></span>
      <div class="status-text">
        <strong id="status-label">Connexion…</strong>
        <small id="status-time">—</small>
      </div>
      <button id="refresh-btn" type="button" title="Actualiser les positions maintenant" aria-label="Actualiser maintenant">↻</button>
    </div>

    <div id="legend" class="legend">
      <div><span class="lg-line"></span> Tracé de la ligne</div>
      <div><span class="lg-stop"></span> Arrêt</div>
      <div><span class="lg-bus"></span> Véhicule temps réel</div>
      <div><span class="lg-velodi"></span> Station DiviaVélodi (vélos dispo)</div>
    </div>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="app.js"></script>
  </body>
</html>
